<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<defs>
		<!-- Shadows -->
		<filter id="tileShadowLeft" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
		</filter>
		<filter id="tileShadowRight" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="-10" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
		</filter>

		<!-- Ceramic Gradient for Tiles -->
		<linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ffffff" />
			<stop offset="85%" stop-color="#f7f5ef" />
			<stop offset="100%" stop-color="#ebe7dc" />
		</linearGradient>

		<!-- Brass Spinner Rivet Gradient -->
		<radialGradient id="brassGrad" cx="35%" cy="35%" r="65%">
			<stop offset="0%" stop-color="#ffe484" />
			<stop offset="45%" stop-color="#d49b35" />
			<stop offset="90%" stop-color="#8a5c0b" />
			<stop offset="100%" stop-color="#543702" />
		</radialGradient>
	</defs>

	<!-- App Icon Background Squircle (Dark Felt Domino Table) -->
	<rect width="512" height="512" rx="115" fill="#141416" />

	<!-- ========================================== -->
	<!-- TILE 1: Left Domino [ J | K ] (Tilted -6°) -->
	<!-- ========================================== -->
	<g transform="translate(80, 85) rotate(-6, 85, 160)" filter="url(#tileShadowLeft)">
		<!-- Tile Body -->
		<rect x="0" y="0" width="170" height="320" rx="22" fill="url(#ceramicGrad)" stroke="#1a1a1d" stroke-width="4.5" />
		<rect x="3.5" y="3.5" width="163" height="313" rx="18" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />

		<!-- Center Divider Groove -->
		<line x1="10" y1="159" x2="160" y2="159" stroke="#1a1a1d" stroke-width="2.5" opacity="0.45" />
		<line x1="10" y1="161.5" x2="160" y2="161.5" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

		<!-- Center Brass Spinner Rivet -->
		<circle cx="85" cy="160" r="9" fill="url(#brassGrad)" stroke="#1a1a1d" stroke-width="1.5" />
		<circle cx="82" cy="157" r="2.5" fill="#ffffff" opacity="0.75" />

		<!-- TOP HALF: Letter 'J' in Pips -->
		<!-- Row 0: Top Bar -->
		<circle cx="42" cy="36" r="11" fill="#121214" />
		<circle cx="85" cy="36" r="11" fill="#121214" />
		<circle cx="128" cy="36" r="11" fill="#121214" />
		<!-- Row 1: Stem -->
		<circle cx="128" cy="68" r="11" fill="#121214" />
		<!-- Row 2: Stem & Hook Left -->
		<circle cx="42" cy="100" r="11" fill="#121214" />
		<circle cx="128" cy="100" r="11" fill="#121214" />
		<!-- Row 3: Hook Bottom -->
		<circle cx="85" cy="128" r="11" fill="#121214" />

		<!-- BOTTOM HALF: Letter 'K' in Pips -->
		<!-- Row 0 -->
		<circle cx="42" cy="192" r="11" fill="#121214" />
		<circle cx="128" cy="192" r="11" fill="#121214" />
		<!-- Row 1 -->
		<circle cx="42" cy="221" r="11" fill="#121214" />
		<circle cx="85" cy="221" r="11" fill="#121214" />
		<!-- Row 2 -->
		<circle cx="42" cy="249" r="11" fill="#121214" />
		<circle cx="75" cy="249" r="11" fill="#121214" />
		<!-- Row 3 -->
		<circle cx="42" cy="277" r="11" fill="#121214" />
		<circle cx="85" cy="277" r="11" fill="#121214" />
		<!-- Row 4 -->
		<circle cx="42" cy="304" r="11" fill="#121214" />
		<circle cx="128" cy="304" r="11" fill="#121214" />
	</g>

	<!-- ============================================ -->
	<!-- TILE 2: Right Domino [ P | ! ] (Tilted +5°)  -->
	<!-- ============================================ -->
	<g transform="translate(255, 108) rotate(5, 85, 160)" filter="url(#tileShadowRight)">
		<!-- Tile Body -->
		<rect x="0" y="0" width="170" height="320" rx="22" fill="url(#ceramicGrad)" stroke="#1a1a1d" stroke-width="4.5" />
		<rect x="3.5" y="3.5" width="163" height="313" rx="18" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />

		<!-- Center Divider Groove -->
		<line x1="10" y1="159" x2="160" y2="159" stroke="#1a1a1d" stroke-width="2.5" opacity="0.45" />
		<line x1="10" y1="161.5" x2="160" y2="161.5" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

		<!-- Center Brass Spinner Rivet -->
		<circle cx="85" cy="160" r="9" fill="url(#brassGrad)" stroke="#1a1a1d" stroke-width="1.5" />
		<circle cx="82" cy="157" r="2.5" fill="#ffffff" opacity="0.75" />

		<!-- TOP HALF: Letter 'P' in Pips -->
		<!-- Row 0: Top Bar -->
		<circle cx="42" cy="36" r="11" fill="#121214" />
		<circle cx="85" cy="36" r="11" fill="#121214" />
		<circle cx="128" cy="36" r="11" fill="#121214" />
		<!-- Row 1: Loop Sides -->
		<circle cx="42" cy="68" r="11" fill="#121214" />
		<circle cx="128" cy="68" r="11" fill="#121214" />
		<!-- Row 2: Loop Bottom -->
		<circle cx="42" cy="100" r="11" fill="#121214" />
		<circle cx="85" cy="100" r="11" fill="#121214" />
		<circle cx="128" cy="100" r="11" fill="#121214" />
		<!-- Row 3: Stem Down -->
		<circle cx="42" cy="128" r="11" fill="#121214" />

		<!-- BOTTOM HALF: Exclamation '!' in Pips -->
		<!-- Exclamation Stem -->
		<circle cx="85" cy="192" r="11" fill="#121214" />
		<circle cx="85" cy="222" r="11" fill="#121214" />
		<circle cx="85" cy="252" r="11" fill="#121214" />
		<!-- Exclamation Dot -->
		<circle cx="85" cy="304" r="11" fill="#121214" />
	</g>
</svg>
